# nginx's add_header does not inherit into a block that declares its own, so no
# location here sets one. Per-path cache policy comes from this map instead,
# which lets the server-level security headers apply everywhere untouched.
map $uri $cache_control {
    default                                    "";
    ~^/build/                                  "public, max-age=31536000, immutable";  # Vite fingerprints these
    ~*\.(?:webp|png|jpe?g|gif|svg|ico|woff2?)$ "public, max-age=2592000";
}

server {
    listen 80;
    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 8m;

    # --- Real client IP ------------------------------------------------------
    # TLS terminates at the reverse proxy on the host, so $remote_addr here is
    # only ever the docker gateway. Walk X-Forwarded-For right-to-left, skipping
    # hops we trust, and stop at the first address we don't — that is the real
    # client. A visitor who prepends a forged entry cannot beat this, because
    # the real proxy appends their true address to the right of it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # --- Upstream ------------------------------------------------------------
    # A literal name in fastcgi_pass is resolved once, at config load, and then
    # pinned for the life of the worker. Compose reassigns container addresses
    # freely when it recreates things — the app and this container have already
    # traded IPs once — so rebuilding only the app left nginx posting requests
    # to an address that by then belonged to nginx itself: a 502 that never
    # cleared until nginx was restarted by hand. Passing through a variable
    # defers the lookup to request time, where Docker's embedded DNS has the
    # current address. valid= caps how long a stale answer can linger; ipv6=off
    # because this bridge network is v4-only and the AAAA query only ever fails.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fpm_upstream joshespi_app:9000;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/ttf font/otf;

    # --- Headers -------------------------------------------------------------
    # HSTS deliberately omits includeSubDomains: the tvtime/dcc/tools/soundboard
    # subdomains are separate deployments and shouldn't be forced from here.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Alpine compiles expressions with new Function(), and Livewire plus the
    # ld+json blocks are inline, so script-src can't be locked down further
    # without a nonce pipeline. This still blocks remote script injection,
    # form hijacking, plugin content, and framing — the bulk of the win.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;
    # Empty for non-asset paths, and nginx omits a header that evaluates to "".
    add_header Cache-Control $cache_control always;

    # --- Backend down --------------------------------------------------------
    # entrypoint.sh runs composer, the Vite build and the migrations before it
    # execs php-fpm, so every redeploy leaves a window with nothing listening on
    # 9000. Answer that with a page that says so, and with 503 rather than 502:
    # 503 is the status that tells a crawler to come back later instead of
    # recording the URL as broken, and Retry-After says roughly when.
    # "=503" is load-bearing: without it nginx serves this page but keeps the
    # upstream's own 502, which is the status that gets a URL demoted.
    error_page 502 503 504 =503 /__maintenance.html;
    location = /__maintenance.html {
        internal;
        root /usr/share/nginx/maintenance;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?)$ {
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        # Only hand FPM paths that actually exist — never a guessed script name.
        try_files $uri =404;

        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Must come after the include so it overrides the client's own header.
        # $remote_addr was resolved by the realip block above, so this is the
        # real client and not a value the visitor picked. Without it a forged
        # X-Forwarded-For mints unlimited intake-form rate-limit buckets.
        # X-Forwarded-Proto and -Host are deliberately passed through untouched:
        # the TLS-terminating proxy in front owns those, and rewriting them
        # would make url() emit http:// in canonical tags and the sitemap.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;

        # server_tokens does not cover the header PHP emits itself.
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
