name: joshespi

services:
  joshespi_app:
    build: .
    container_name: joshespi_app
    restart: unless-stopped
    # Single source for config. The .env file is deliberately NOT also bind
    # mounted: entrypoint.sh needs APP_ENV as a real environment variable, and
    # Laravel reads real env vars fine without the file on disk.
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/www/html
    # entrypoint.sh does the whole install-build-migrate sequence before it
    # execs php-fpm, so "container running" says nothing about whether anything
    # is listening. Probe the socket itself. php is the only tool in the image
    # that can open one — there is no curl or nc here.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 5
      # Generous, because a cold boot has to run composer install and the Vite
      # build off a bind mount. Failures inside this window don't count against
      # retries, so a slow build is never mistaken for a broken container.
      start_period: 300s
    networks:
      - joshespi_net

  joshespi_nginx:
    image: nginx:alpine
    container_name: joshespi_nginx
    restart: unless-stopped
    # The TLS-terminating reverse proxy is nginx on a SEPARATE box; this is the
    # docker host. Binding 127.0.0.1 here published the port to nobody at all —
    # no other machine can route to this one's loopback — so every request to
    # joshespi.com got a 502 from the proxy itself. That error page identifies
    # the proxy build (nginx/1.24.0 Ubuntu), not the 1.31.1/alpine in here,
    # which is how to tell this failure apart from a genuine upstream one.
    #
    # The forged X-Forwarded-For that the loopback bind was reaching for is
    # dealt with where it belongs: set_real_ip_from in docker/nginx.conf now
    # trusts the proxy alone rather than all of RFC1918, so a LAN peer that
    # connects here directly has its XFF header ignored instead of believed.
    # Set JOSHESPI_BIND_ADDR to a single interface to narrow this further.
    ports:
      - "${JOSHESPI_BIND_ADDR:-0.0.0.0}:8081:80"
    volumes:
      - ./src/public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/maintenance.html:/usr/share/nginx/maintenance/__maintenance.html:ro
    depends_on:
      joshespi_app:
        # Wait for fpm to actually accept connections, not just for the
        # container to exist. Without this a fresh "compose up" spent the whole
        # build serving 502s. It does not cover a rebuild of the app alone —
        # nginx keeps running there — which is what the error_page fallback and
        # the runtime DNS lookup in nginx.conf are for.
        condition: service_healthy
    networks:
      - joshespi_net

networks:
  joshespi_net:
